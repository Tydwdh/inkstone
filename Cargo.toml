[workspace]
resolver = "2"
members = [
    "crates/edit-core",
    "crates/edit-rpc",
    "crates/edit-server",
    "crates/edit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
edit-core = { path = "crates/edit-core" }
edit-rpc = { path = "crates/edit-rpc" }

crossterm = "0.29"
ropey = "1.6"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
crossbeam-channel = "0.5"
unicode-segmentation = "1"
unicode-width = "0.2"
directories = "6"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1
